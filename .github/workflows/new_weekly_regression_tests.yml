name: New Weekly Regression Tests

on:
  # schedule:
  #   # 5am UTC = 12am EST (Saturday)
  #   - cron: '0 5 * * 6'

  # Allows you to run this workflow manually from the Actions tab and change the
  # testing environment, OSF service, and browser.
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Testing Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - test4
          - stage1
          - stage2
          - stage3
          - stage4
          - prod
      service:
        description: 'OSF Service'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Login
          - Search
          - User
      browser:
        description: 'Browser'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - chromium
          - firefox
          - edge

env:
  HEADLESS: 'true'
  DEFAULT_TEST_ENV: test
  DEFAULT_SERVICE: All
  DEFAULT_BROWSER: All
  NEW_USER_EMAIL: ${{ secrets.NEW_USER_EMAIL }}
  USER_ONE: ${{ secrets.USER_ONE }}
  USER_ONE_PASSWORD: ${{ secrets.USER_ONE_PASSWORD }}
  USER_TWO: ${{ secrets.USER_TWO }}
  USER_TWO_PASSWORD: ${{ secrets.USER_TWO_PASSWORD }}
  DEACTIVATED_USER: ${{ secrets.DEACTIVATED_USER }}
  DEACTIVATED_USER_PASSWORD: ${{ secrets.DEACTIVATED_USER_PASSWORD }}
  UNCONFIRMED_USER: ${{ secrets.UNCONFIRMED_USER }}
  UNCONFIRMED_USER_PASSWORD: ${{ secrets.UNCONFIRMED_USER_PASSWORD }}
  CAS_2FA_USER: ${{ secrets.CAS_2FA_USER }}
  CAS_2FA_USER_PASSWORD: ${{ secrets.CAS_2FA_USER_PASSWORD }}
  CAS_TOS_USER: ${{ secrets.CAS_TOS_USER }}
  CAS_TOS_USER_PASSWORD: ${{ secrets.CAS_TOS_USER_PASSWORD }}
  DEVAPP_CLIENT_ID: ${{ secrets.DEVAPP_CLIENT_ID }}
  DEVAPP_CLIENT_SECRET: ${{ secrets.DEVAPP_CLIENT_SECRET }}
  IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
  IMAP_EMAIL_PASSWORD: ${{ secrets.IMAP_EMAIL_PASSWORD }}
  IMAP_HOST: ${{ secrets.IMAP_HOST }}
  REGISTRATIONS_USER: ${{ secrets.REGISTRATIONS_USER }}
  REGISTRATIONS_USER_PASSWORD: ${{ secrets.REGISTRATIONS_USER_PASSWORD }}
  PREFERRED_NODE: ${{ secrets.PREFERRED_NODE }}
  POPULAR_PAGES: ${{ secrets.POPULAR_PAGES }}
  PROFILE_USER: ${{ secrets.PROFILE_USER }}
  PROFILE_USER_PASSWORD: ${{ secrets.PROFILE_USER_PASSWORD }}
  USER_ONE_STAGE1_PAT: ${{ secrets.USER_ONE_STAGE1_PAT }}
  USER_ONE_STAGE2_PAT: ${{ secrets.USER_ONE_STAGE2_PAT }}
  USER_ONE_STAGE3_PAT: ${{ secrets.USER_ONE_STAGE3_PAT }}
  USER_ONE_STAGE4_PAT: ${{ secrets.USER_ONE_STAGE4_PAT }}
  USER_ONE_TEST_PAT: ${{ secrets.USER_ONE_TEST_PAT }}
  USER_ONE_TEST4_PAT: ${{ secrets.USER_ONE_TEST4_PAT }}
  USER_ONE_PAT: ${{ secrets.USER_ONE_PAT }}
  MENDELEY_EMAIL: ${{ secrets.MENDELEY_EMAIL }}
  MENDELEY_PASSWORD: ${{ secrets.MENDELEY_PASSWORD }}
  ZOTERO_USER: ${{ secrets.ZOTERO_USER }}
  ZOTERO_PASSWORD: ${{ secrets.ZOTERO_PASSWORD }}
  DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
  DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
  ADMIN_USER: ${{ secrets.ADMIN_USER }}
  ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
  WRITE_USER: ${{ secrets.WRITE_USER }}
  WRITE_USER_PASSWORD: ${{ secrets.WRITE_USER_PASSWORD }}
  READ_USER: ${{ secrets.READ_USER }}
  READ_USER_PASSWORD: ${{ secrets.READ_USER_PASSWORD }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # Need to set the test_env, service, and browser values in this job first so
  # that when the workflow is run from the scheduler the correct default values
  # will be used, since the scheduler does not have inputs.
  set_variables:
    name: Set the Test Env, Service, and Browser for Regression Tests
    runs-on: ubuntu-latest
    outputs:
      test_env: ${{ github.event.inputs.test_env || env.DEFAULT_TEST_ENV }}
      service: ${{ github.event.inputs.service || env.DEFAULT_SERVICE }}
      browser: ${{ github.event.inputs.browser || env.DEFAULT_BROWSER }}
    steps:
      - run: echo "Set Test Env, Service, and Browser Values"

  # This job sets the browser(s) that will be used in the regression_test job below.
  # When run from the scheduler all the available browsers will be used, and when
  # run manually from the Actions tab the user can select which browser to use.
  set_matrix:
    name: Set Matrix of Browser Values
    needs: [set_variables]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          if [ "${{ needs.set_variables.outputs.browser }}" = "All" ]; then
            echo 'matrix=["chromium","firefox","edge"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${{ needs.set_variables.outputs.browser }}\"]" >> "$GITHUB_OUTPUT"
          fi

  regression_test:
    name: Regression Tests (${{ matrix.browser }})
    needs: [set_variables, set_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # run in series, mirrors the Python suite's BrowserStack concurrency limit
      matrix:
        browser: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      # As more spec files are ported, add a case here mapping the "service"
      # dropdown value to its corresponding test file(s).
      - name: Determine test path for selected service
        id: test_path
        run: |
          case "${{ needs.set_variables.outputs.service }}" in
            Login) echo "path=tests/login.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Search) echo "path=tests/search.spec.ts" >> "$GITHUB_OUTPUT" ;;
            User) echo "path=tests/user.spec.ts" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=tests/" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run regression tests
        env:
          TEST_ENV: ${{ needs.set_variables.outputs.test_env }}
        run: npx playwright test "${{ steps.test_path.outputs.path }}" --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces/videos/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Send Slack notification on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Weekly Regression Tests FAILED* on `${{ matrix.browser }}`",
              "attachments": [
                {
                  "color": "danger",
                  "text": "*Environment:* `${{ needs.set_variables.outputs.test_env }}`\n*Service:* `${{ needs.set_variables.outputs.service }}`\n\n*Reports:* Download from GitHub Actions artifacts\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs & Reports ->"
                }
              ]
            }
