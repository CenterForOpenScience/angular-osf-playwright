name: New Weekly Regression Tests

on:
  # Runs on UAT1 every Wednesday at 2:00 AM US Eastern time. GitHub's cron is UTC-only,
  # so both possible UTC times are scheduled and set_variables' DST guard lets only the
  # one matching the current New York offset through:
  #   - 2am EDT (UTC-4, mid-March to early November) = 06:00 UTC
  #   - 2am EST (UTC-5, early November to mid-March) = 07:00 UTC
  # The other trigger finishes in seconds with every test job skipped. DST switches
  # happen on Sundays, so a delayed Wednesday trigger can't land on the wrong side of
  # one. Schedules only run from the default branch, and GitHub may start them late.
  schedule:
    - cron: '0 6 * * 3'
    - cron: '0 7 * * 3'

  # Allows you to run this workflow manually from the Actions tab and change the
  # testing environment, OSF service, and browser.
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Testing Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - test2
          - test3
          - test4
          - uat1
          - prod
      service:
        description: 'OSF Service'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Collections
          - Dashboard
          - Institutions
          - Login
          - MyPreprints
          - MyRegistrations
          - Navbar
          - Preprints
          - Profile
          - RegistrationMetadata
          - RegistrationModeration
          - RegistrationSidebar
          - RegistrationUserPermissions
          - Registries
          - Search
          - SignUp
          - User
      browser:
        description: 'Browser'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - chromium
          - firefox
          - edge
          - webkit
      send_email:
        description: 'Email the results to REPORT_RECIPIENTS (scheduled runs always do)'
        required: false
        default: false
        type: boolean

env:
  HEADLESS: 'true'
  DEFAULT_TEST_ENV: test
  # Scheduled runs always target UAT1; manual runs use the test_env input.
  SCHEDULED_TEST_ENV: uat1
  # Comma-separated recipients of the results email sent after each scheduled run.
  REPORT_RECIPIENTS: otsegelnyk@exoft.net, osmand@cos.io, bgeiger@cos.io, matt@cos.io, ykopka@exoft.net
  DEFAULT_SERVICE: All
  # Scheduled runs only use Chromium; manual runs use the browser input (which can be All).
  DEFAULT_BROWSER: chromium
  NEW_USER_EMAIL: ${{ secrets.NEW_USER_EMAIL }}
  USER_ONE: ${{ secrets.USER_ONE }}
  USER_ONE_PASSWORD: ${{ secrets.USER_ONE_PASSWORD }}
  USER_TWO: ${{ secrets.USER_TWO }}
  USER_TWO_PASSWORD: ${{ secrets.USER_TWO_PASSWORD }}
  DEACTIVATED_USER: ${{ secrets.DEACTIVATED_USER }}
  DEACTIVATED_USER_PASSWORD: ${{ secrets.DEACTIVATED_USER_PASSWORD }}
  UNCONFIRMED_USER: ${{ secrets.UNCONFIRMED_USER }}
  UNCONFIRMED_USER_PASSWORD: ${{ secrets.UNCONFIRMED_USER_PASSWORD }}
  CAS_2FA_USER: ${{ secrets.CAS_2FA_USER }}
  CAS_2FA_USER_PASSWORD: ${{ secrets.CAS_2FA_USER_PASSWORD }}
  CAS_TOS_USER: ${{ secrets.CAS_TOS_USER }}
  CAS_TOS_USER_PASSWORD: ${{ secrets.CAS_TOS_USER_PASSWORD }}
  DEVAPP_CLIENT_ID: ${{ secrets.DEVAPP_CLIENT_ID }}
  DEVAPP_CLIENT_SECRET: ${{ secrets.DEVAPP_CLIENT_SECRET }}
  IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
  IMAP_EMAIL_PASSWORD: ${{ secrets.IMAP_EMAIL_PASSWORD }}
  IMAP_HOST: ${{ secrets.IMAP_HOST }}
  REGISTRATIONS_USER: ${{ secrets.REGISTRATIONS_USER }}
  REGISTRATIONS_USER_PASSWORD: ${{ secrets.REGISTRATIONS_USER_PASSWORD }}
  PREFERRED_NODE: ${{ secrets.PREFERRED_NODE }}
  POPULAR_PAGES: ${{ secrets.POPULAR_PAGES }}
  PROFILE_USER: ${{ secrets.PROFILE_USER }}
  PROFILE_USER_PASSWORD: ${{ secrets.PROFILE_USER_PASSWORD }}
  USER_ONE_TEST_PAT: ${{ secrets.USER_ONE_TEST_PAT }}
  USER_ONE_TEST2_PAT: ${{ secrets.USER_ONE_TEST2_PAT }}
  USER_ONE_TEST3_PAT: ${{ secrets.USER_ONE_TEST3_PAT }}
  USER_ONE_TEST4_PAT: ${{ secrets.USER_ONE_TEST4_PAT }}
  USER_ONE_UAT1_PAT: ${{ secrets.USER_ONE_UAT1_PAT }}
  USER_ONE_PAT: ${{ secrets.USER_ONE_PAT }}
  MENDELEY_EMAIL: ${{ secrets.MENDELEY_EMAIL }}
  MENDELEY_PASSWORD: ${{ secrets.MENDELEY_PASSWORD }}
  ZOTERO_USER: ${{ secrets.ZOTERO_USER }}
  ZOTERO_PASSWORD: ${{ secrets.ZOTERO_PASSWORD }}
  DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
  DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
  ADMIN_USER: ${{ secrets.ADMIN_USER }}
  ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
  WRITE_USER: ${{ secrets.WRITE_USER }}
  WRITE_USER_PASSWORD: ${{ secrets.WRITE_USER_PASSWORD }}
  READ_USER: ${{ secrets.READ_USER }}
  READ_USER_PASSWORD: ${{ secrets.READ_USER_PASSWORD }}
  RL_BYPASS_TOKEN: ${{ secrets.RL_BYPASS_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SMTP_SERVER: ${{ secrets.SMTP_SERVER }}

jobs:
  # Need to set the test_env, service, and browser values in this job first so
  # that when the workflow is run from the scheduler the correct default values
  # will be used, since the scheduler does not have inputs. Also decides whether
  # this run should happen at all (DST guard, see `on.schedule`) and whether it
  # emails its results.
  set_variables:
    name: Set the Test Env, Service, and Browser for Regression Tests
    runs-on: ubuntu-latest
    outputs:
      test_env: ${{ github.event_name == 'schedule' && env.SCHEDULED_TEST_ENV || github.event.inputs.test_env || env.DEFAULT_TEST_ENV }}
      service: ${{ github.event.inputs.service || env.DEFAULT_SERVICE }}
      browser: ${{ github.event.inputs.browser || env.DEFAULT_BROWSER }}
      should_run: ${{ steps.dst_guard.outputs.should_run }}
      send_email: ${{ steps.dst_guard.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event.inputs.send_email == 'true') }}
    steps:
      - name: Check the schedule trigger matches US Eastern time (DST guard)
        id: dst_guard
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # -0400 while New York is on EDT, -0500 while on EST.
          offset=$(TZ=America/New_York date +%z)
          case "$offset|$TRIGGER_CRON" in
            "-0400|0 6 * * 3" | "-0500|0 7 * * 3") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "New York UTC offset: $offset, trigger: '$TRIGGER_CRON', should_run: $should_run"
          if [ "$should_run" = "false" ]; then
            echo "Skipped: the '$TRIGGER_CRON' (UTC) trigger isn't 2am in New York at UTC offset $offset; the other weekly trigger runs the tests." >> "$GITHUB_STEP_SUMMARY"
          fi

  # This job sets the browser(s) that will be used in the regression_test job below.
  # When run from the scheduler only Chromium is used (DEFAULT_BROWSER), and when
  # run manually from the Actions tab the user can select which browser to use.
  set_matrix:
    name: Set Matrix of Browser Values
    needs: [set_variables]
    if: needs.set_variables.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          if [ "${{ needs.set_variables.outputs.browser }}" = "All" ]; then
            echo 'matrix=["chromium","firefox","edge","webkit"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${{ needs.set_variables.outputs.browser }}\"]" >> "$GITHUB_OUTPUT"
          fi

  regression_test:
    name: Regression Tests (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    needs: [set_variables, set_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # run in series, mirrors the Python suite's BrowserStack concurrency limit
      matrix:
        browser: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
        # GitHub-hosted jobs are capped at 6h each, and the full suite takes longer
        # than that. Splitting it into shards gives each one its own 6h limit; with
        # max-parallel: 1 they still run one at a time against the test env.
        shard: [1, 2]
    timeout-minutes: 360
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      # As more spec files are ported, add a case here mapping the "service"
      # dropdown value to its corresponding test file(s).
      - name: Determine test path for selected service
        id: test_path
        run: |
          case "${{ needs.set_variables.outputs.service }}" in
            Collections) echo "path=tests/collections.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Dashboard) echo "path=tests/dashboard.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Institutions) echo "path=tests/institutions.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Login) echo "path=tests/login.spec.ts" >> "$GITHUB_OUTPUT" ;;
            MyPreprints) echo "path=tests/myPreprints.spec.ts" >> "$GITHUB_OUTPUT" ;;
            MyRegistrations) echo "path=tests/myRegistrations.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Navbar) echo "path=tests/navbar.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Preprints) echo "path=tests/preprints.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Profile) echo "path=tests/profile.spec.ts" >> "$GITHUB_OUTPUT" ;;
            RegistrationMetadata) echo "path=tests/registrationMetadata.spec.ts" >> "$GITHUB_OUTPUT" ;;
            RegistrationModeration) echo "path=tests/registrationModeration.spec.ts" >> "$GITHUB_OUTPUT" ;;
            RegistrationSidebar) echo "path=tests/registrationSidebar.spec.ts" >> "$GITHUB_OUTPUT" ;;
            RegistrationUserPermissions) echo "path=tests/registrationUserPermissions.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Registries) echo "path=tests/registries.spec.ts" >> "$GITHUB_OUTPUT" ;;
            Search) echo "path=tests/search.spec.ts" >> "$GITHUB_OUTPUT" ;;
            SignUp) echo "path=tests/signUp.spec.ts" >> "$GITHUB_OUTPUT" ;;
            User) echo "path=tests/user.spec.ts" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=tests/" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run regression tests
        env:
          TEST_ENV: ${{ needs.set_variables.outputs.test_env }}
          # Turns on the blob reporter (see playwright.config.ts) for the merge_reports job.
          BLOB_REPORT_NAME: ${{ matrix.browser }}-shard${{ matrix.shard }}
        run: npx playwright test "${{ steps.test_path.outputs.path }}" --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Write failed tests summary
        if: always()
        run: node scripts/write-failure-summary.js test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        id: upload_report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report for merging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload test results (traces/videos/screenshots)
        if: failure()
        id: upload_results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Add report/trace links to summary
        if: always()
        run: |
          {
            echo "### 📊 Reports (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)"
            echo "- [Playwright HTML report](${{ steps.upload_report.outputs.artifact-url }}) - unzip, then run \`npx playwright show-report <folder>\` for the full report with pass/fail per test."
            if [ -n "${{ steps.upload_results.outputs.artifact-url }}" ]; then
              echo "- [Raw test results / traces / videos](${{ steps.upload_results.outputs.artifact-url }}) - unzip, then run \`npx playwright show-trace <path-to-a-trace.zip>\` to open the trace viewer for one failed test directly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Weekly Regression Tests FAILED* on `${{ matrix.browser }}` (shard ${{ matrix.shard }}/2)",
              "attachments": [
                {
                  "color": "danger",
                  "text": "*Environment:* `${{ needs.set_variables.outputs.test_env }}`\n*Service:* `${{ needs.set_variables.outputs.service }}`\n\n*Reports:* Download from GitHub Actions artifacts\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs & Reports ->"
                }
              ]
            }

  # Combines every shard's blob report into one HTML report. Runs even when shards
  # fail, and warns in the summary if a shard's blob report is missing (e.g. it hit
  # the 6h job limit or was canceled before uploading), since the merged report
  # would otherwise silently lack that shard's tests.
  merge_reports:
    name: Merge Playwright Reports
    needs: [set_matrix, regression_test]
    if: always() && needs.set_matrix.result == 'success'
    runs-on: ubuntu-latest
    env:
      SHARD_TOTAL: 2 # keep in sync with regression_test's matrix.shard list
    outputs:
      expected: ${{ steps.check.outputs.expected }}
      found: ${{ steps.check.outputs.found }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Check all shards reported
        id: check
        run: |
          mkdir -p all-blob-reports
          browsers=$(echo '${{ needs.set_matrix.outputs.matrix }}' | jq length)
          expected=$((browsers * SHARD_TOTAL))
          found=$(find all-blob-reports -name '*.zip' | wc -l)
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [ "$found" -lt "$expected" ]; then
            echo "::warning::Only $found of $expected shard blob reports found - the merged report is missing tests."
            echo "> ⚠️ **Merged report is incomplete:** only $found of $expected shards uploaded a blob report. Check the shard jobs and their own reports." >> "$GITHUB_STEP_SUMMARY"
          fi

      # merge.config.ts writes both the HTML report and merged-results/results.json.
      - name: Merge into HTML and JSON reports
        if: steps.check.outputs.found != '0'
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload merged JSON results
        if: steps.check.outputs.found != '0'
        uses: actions/upload-artifact@v4
        with:
          name: merged-results
          path: merged-results/
          retention-days: 7

      - name: Upload merged HTML report
        if: steps.check.outputs.found != '0'
        id: upload_merged
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 7

      - name: Add merged report link to summary
        if: steps.check.outputs.found != '0'
        run: |
          {
            echo "### 📊 Merged report (all shards)"
            echo "- [Playwright HTML report](${{ steps.upload_merged.outputs.artifact-url }}) - unzip, then run: npx playwright show-report <folder>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Emails the results after every scheduled run (and manual runs with send_email
  # checked), whatever the outcome - including when every shard failed and there
  # is no merged report. Needs these repository secrets: SMTP_SERVER, SMTP_PORT,
  # SMTP_USERNAME, SMTP_PASSWORD, and optionally SMTP_FROM (defaults to SMTP_USERNAME).
  email_results:
    name: Email Test Results
    needs: [set_variables, set_matrix, regression_test, merge_reports]
    if: always() && needs.set_variables.outputs.send_email == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Download merged JSON results
        continue-on-error: true # missing when no shard uploaded a blob report
        uses: actions/download-artifact@v4
        with:
          name: merged-results
          path: merged-results

      - name: Build email
        id: email
        env:
          TEST_ENV: ${{ needs.set_variables.outputs.test_env }}
          SERVICE: ${{ needs.set_variables.outputs.service }}
          BROWSERS: ${{ join(fromJson(needs.set_matrix.outputs.matrix || '[]'), ', ') }}
          REGRESSION_RESULT: ${{ needs.regression_test.result }}
          EXPECTED_SHARDS: ${{ needs.merge_reports.outputs.expected }}
          FOUND_SHARDS: ${{ needs.merge_reports.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/write-email-summary.js merged-results/results.json > email-body.html

      - name: Send email
        if: env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: OSF Playwright Tests <${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}>
          to: ${{ env.REPORT_RECIPIENTS }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://email-body.html

      - name: Warn when email isn't configured
        if: env.SMTP_SERVER == ''
        run: echo "::warning::SMTP_SERVER secret is not set - the results email was not sent."
