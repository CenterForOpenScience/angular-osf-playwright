name: Production Smoke Tests

on:
  # schedule:
  #   - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - chromium
          - firefox
          - edge

env:
  HEADLESS: 'true'
  TEST_ENV: prod
  NEW_USER_EMAIL: ${{ secrets.NEW_USER_EMAIL }}
  USER_ONE: ${{ secrets.USER_ONE }}
  USER_ONE_PASSWORD: ${{ secrets.USER_ONE_PASSWORD }}
  USER_TWO: ${{ secrets.USER_TWO }}
  USER_TWO_PASSWORD: ${{ secrets.USER_TWO_PASSWORD }}
  DEACTIVATED_USER: ${{ secrets.DEACTIVATED_USER }}
  DEACTIVATED_USER_PASSWORD: ${{ secrets.DEACTIVATED_USER_PASSWORD }}
  UNCONFIRMED_USER: ${{ secrets.UNCONFIRMED_USER }}
  UNCONFIRMED_USER_PASSWORD: ${{ secrets.UNCONFIRMED_USER_PASSWORD }}
  CAS_2FA_USER: ${{ secrets.CAS_2FA_USER }}
  CAS_2FA_USER_PASSWORD: ${{ secrets.CAS_2FA_USER_PASSWORD }}
  CAS_TOS_USER: ${{ secrets.CAS_TOS_USER }}
  CAS_TOS_USER_PASSWORD: ${{ secrets.CAS_TOS_USER_PASSWORD }}
  DEVAPP_CLIENT_ID: ${{ secrets.DEVAPP_CLIENT_ID }}
  DEVAPP_CLIENT_SECRET: ${{ secrets.DEVAPP_CLIENT_SECRET }}
  IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
  IMAP_EMAIL_PASSWORD: ${{ secrets.IMAP_EMAIL_PASSWORD }}
  IMAP_HOST: ${{ secrets.IMAP_HOST }}
  REGISTRATIONS_USER: ${{ secrets.REGISTRATIONS_USER }}
  REGISTRATIONS_USER_PASSWORD: ${{ secrets.REGISTRATIONS_USER_PASSWORD }}
  PREFERRED_NODE: ${{ secrets.PREFERRED_NODE }}
  POPULAR_PAGES: ${{ secrets.POPULAR_PAGES }}
  PROFILE_USER: ${{ secrets.PROFILE_USER }}
  PROFILE_USER_PASSWORD: ${{ secrets.PROFILE_USER_PASSWORD }}
  USER_ONE_STAGE1_PAT: ${{ secrets.USER_ONE_STAGE1_PAT }}
  USER_ONE_STAGE2_PAT: ${{ secrets.USER_ONE_STAGE2_PAT }}
  USER_ONE_STAGE3_PAT: ${{ secrets.USER_ONE_STAGE3_PAT }}
  USER_ONE_STAGE4_PAT: ${{ secrets.USER_ONE_STAGE4_PAT }}
  USER_ONE_TEST_PAT: ${{ secrets.USER_ONE_TEST_PAT }}
  USER_ONE_TEST2_PAT: ${{ secrets.USER_ONE_TEST2_PAT }}
  USER_ONE_TEST3_PAT: ${{ secrets.USER_ONE_TEST3_PAT }}
  USER_ONE_TEST4_PAT: ${{ secrets.USER_ONE_TEST4_PAT }}
  USER_ONE_UAT1_PAT: ${{ secrets.USER_ONE_UAT1_PAT }}
  USER_ONE_PAT: ${{ secrets.USER_ONE_PAT }}
  MENDELEY_EMAIL: ${{ secrets.MENDELEY_EMAIL }}
  MENDELEY_PASSWORD: ${{ secrets.MENDELEY_PASSWORD }}
  ZOTERO_USER: ${{ secrets.ZOTERO_USER }}
  ZOTERO_PASSWORD: ${{ secrets.ZOTERO_PASSWORD }}
  DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
  DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
  ADMIN_USER: ${{ secrets.ADMIN_USER }}
  ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
  WRITE_USER: ${{ secrets.WRITE_USER }}
  WRITE_USER_PASSWORD: ${{ secrets.WRITE_USER_PASSWORD }}
  READ_USER: ${{ secrets.READ_USER }}
  READ_USER_PASSWORD: ${{ secrets.READ_USER_PASSWORD }}

jobs:
  # This job sets the browser(s) that will be used in the smoke_test job below.
  # When run from the scheduler all the available browsers will be used, and when
  # run manually from the Actions tab the user can select which browser to use.
  set_matrix:
    name: Set Matrix of Browser Values
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          if [ "${{ github.event.inputs.browser || 'All' }}" = "All" ]; then
            echo 'matrix=["chromium","firefox","edge"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${{ github.event.inputs.browser }}\"]" >> "$GITHUB_OUTPUT"
          fi

  smoke_test:
    name: Prod Smoke Tests (${{ matrix.browser }})
    needs: [set_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # run in series, mirrors the Python suite's BrowserStack concurrency limit
      matrix:
        browser: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      # Mirrors the Python suite's `invoke test_selenium_on_prod_part1/part2`: only smoke
      # tests (`-m smoke_test` there, `@smoke` here), all spec files sorted and split into
      # two halves, each half run as its own step, one retry for failed tests (MAX_RETRIES=1).
      - name: Split spec files into two parts
        id: split
        run: |
          files=$(ls tests/*.spec.ts | grep -v '_debug_inspect' | sort)
          count=$(echo "$files" | wc -l)
          half=$((count / 2))
          echo "part1=$(echo "$files" | head -n "$half" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "part2=$(echo "$files" | tail -n +"$((half + 1))" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests part one
        id: part1
        continue-on-error: true
        run: |
          echo "Part one files: ${{ steps.split.outputs.part1 }}"
          npx playwright test ${{ steps.split.outputs.part1 }} --project=${{ matrix.browser }} --grep @smoke --retries=1

      # Each run wipes test-results/ and playwright-report/, so keep part one's output
      # before part two starts.
      - name: Save part one results
        if: always()
        run: |
          mkdir -p results/part1
          [ -d test-results ] && mv test-results results/part1/test-results || true
          [ -d playwright-report ] && mv playwright-report results/part1/playwright-report || true

      - name: Run smoke tests part two
        id: part2
        if: always()
        continue-on-error: true
        run: |
          echo "Part two files: ${{ steps.split.outputs.part2 }}"
          npx playwright test ${{ steps.split.outputs.part2 }} --project=${{ matrix.browser }} --grep @smoke --retries=1

      - name: Save part two results
        if: always()
        run: |
          mkdir -p results/part2
          [ -d test-results ] && mv test-results results/part2/test-results || true
          [ -d playwright-report ] && mv playwright-report results/part2/playwright-report || true

      - name: Write failed tests summary
        if: always()
        run: |
          for part in part1 part2; do
            echo "## Smoke tests ${part} (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "results/${part}/test-results/results.json" ]; then
              node scripts/write-failure-summary.js "results/${part}/test-results/results.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No results.json found for ${part}." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload Playwright reports
        if: always()
        id: upload_report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: results/*/playwright-report/
          retention-days: 7

      - name: Upload test results (traces/videos/screenshots)
        if: steps.part1.outcome != 'success' || steps.part2.outcome != 'success'
        id: upload_results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: results/*/test-results/
          retention-days: 7

      - name: Add report/trace links to summary
        if: always()
        run: |
          {
            echo "### 📊 Reports (${{ matrix.browser }})"
            echo "- [Playwright HTML reports](${{ steps.upload_report.outputs.artifact-url }}) - unzip, then run \`npx playwright show-report <folder>/part1/playwright-report\` (or \`part2\`) for the full report with pass/fail per test."
            if [ -n "${{ steps.upload_results.outputs.artifact-url }}" ]; then
              echo "- [Raw test results / traces / videos](${{ steps.upload_results.outputs.artifact-url }}) - unzip, then run \`npx playwright show-trace <path-to-a-trace.zip>\` to open the trace viewer for one failed test directly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any test suite failed
        if: always()
        run: |
          if [[ "${{ steps.part1.outcome }}" != "success" || "${{ steps.part2.outcome }}" != "success" ]]; then
            echo "One or more smoke test suites failed"
            exit 1
          fi
